name: Version label

# Every pull request says how it changes the version with one label, and leaves the version in package.json
# alone: the version is raised once the pull request is merged (see version.yml)
# A draft pull request is skipped: open it as a draft, add the label, then mark it ready for review,
# so that the check never fails only because the label is not there yet
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
  version-label:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: One label, minor or patch
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          count=$(echo "$LABELS" | grep -oE '"(minor|patch)"' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Add one label: minor (a new feature or a visible change) or patch (nothing changes visually)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The version in package.json is left alone
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base=$(git show "origin/$BASE_REF:package.json" | jq -r .version)
          head=$(jq -r .version package.json)
          if [ "$base" != "$head" ]; then
            echo "::error::package.json changes the version from $base to $head: leave it, it is raised when the pull request is merged"
            exit 1
          fi
